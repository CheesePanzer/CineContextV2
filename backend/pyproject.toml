[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cinecontext"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "sqlalchemy[asyncio]>=2.0.36",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.32",
    "openai",
    "httpx",
    "pydantic",
]

[tool.setuptools.packages.find]
include = ["cinecontext*", "alcedo*"]
